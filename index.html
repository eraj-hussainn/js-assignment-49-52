<body>

    <h1>JavaScript Assignment</h1>


    <!-- QUESTION 1 -->
    <!-- Create a signup form and display form data in your webpage on submission. -->

 <div class="section">
    <h2>1. Signup Form</h2>

    <div id="signupForm">

        <input type="text" id="userName"
        placeholder="Enter your name" required>

        <br><br>

        <input type="email" id="userEmail"
        placeholder="Enter your email" required>

        <br><br>

        <input type="password" id="userPassword"
        placeholder="Enter password" required>

        <br><br>

        <button type="button" onclick="post()">Sign Up</button>

    </div>

    <div id="result"></div>
</div>

       
     
    <hr>


    <!-- QUESTION 2 -->
    <!-- Create a Read More button to display complete item details. -->

 
<p id="slowLoris">
Slow lorises are a group of several species of strepsirrhine primates which make up the genus Nycticebus.
</p>
<a href="javascript:void(0);" onClick="expand();" id="link"><em>see more</em></a>


    <hr>


    <!-- QUESTION 3 -->
    <!-- Create a student form and display student details in a table.
    Each row must have Edit and Delete buttons.
    Edit button should display a hidden form with that row's values. -->

    <form class="section" onsubmit="addStudent(event)">

        <h2>3. Student Details</h2>

        <div id="studentForm">

            <input type="text" id="studentName" placeholder="Student Name" required>

            <input type="text" id="studentClass" placeholder="Class" required>

            <input type="text" id="studentRoll" placeholder="Roll Number" required>

            <input type="email" id="studentEmail" placeholder="Email" required>

            <br>

            <button type="submit">Add Student</button>

        </form>


        <!-- Student Table -->
<h2>Studenr Record</h2>
        <table>

            <thead>
                <tr>
                    <th>Name</th>
                    <th>Class</th>
                    <th>Roll Number</th>
                    <th>Email</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="studentTable">

            </tbody>

        </table>


        Hidden Edit Form

        <form id="editForm">

            <h3>Edit Student Details</h3>

            <input type="text" id="editName" placeholder="Student Name" required>

            <input type="text" id="editClass" placeholder="Class" required>

            <input type="text" id="editRoll" placeholder="Roll Number" required>

            <input type="email" id="editEmail" placeholder="Email" required>

            <br>

            <button type="submit">Update Student</button>

            <button type="button" onclick="cancelEdit()">Cancel</button>

        </form>

    </div>

<script src="app.js"></script>

</body>
</html>
